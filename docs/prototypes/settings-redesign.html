<body><main>
<header class="intro"><div><span class="kicker">VIRTUGENE / DESIGN PROPOSAL</span><h1>设置，应该让人轻松做决定。</h1><p>先看到当前状态，再进入需要调整的内容。每项设置都说明影响范围。</p></div><button class="theme" id="theme">切换浅色预览</button></header>
<div class="gallery">
<section><div class="caption">01 总设置 <b>清楚的分类与状态</b></div><div class="phone dark" id="general"></div></section>
<section><div class="caption">02 聊天设置 <b>角色与全局分开</b></div><div class="phone dark" id="chat"></div></section>
<section><div class="caption">03 世界偏好 <b>长期设定与当前操作</b></div><div class="phone dark" id="world"></div></section>
<section><div class="caption">04 朋友圈设置 <b>容易理解的可见范围</b></div><div class="phone dark" id="moments"></div></section>
</div><p class="example">可点击原型 · 所有数据均为设计示例，开关与保存仅在本页演示，不影响软件数据。<br>可切换主题、搜索入口、进入字号与语音详情，点击世界加入方式查看选择状态。</p>
</main>
<script>
const paths={back:'m14 6-6 6 6 6',arrow:'m9 6 6 6-6 6',search:'m16 16 4 4 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',person:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 21v-2a8 8 0 0 1 16 0v2',theme:'M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9',chat:'M4 4h16v12H9l-5 4V4 M8 8h8 M8 12h5',voice:'M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3 M5 10v2a7 7 0 0 0 14 0v-2 M12 19v3',connect:'M8 4v4 M16 4v4 M5 8h14v2a7 7 0 0 1-14 0V8 M12 17v5',shield:'M12 3 3 7v5c0 5 9 9 9 9s9-4 9-9V7l-9-4 M8 12l3 3 5-6',data:'M12 3c5 0 9 2 9 4s-4 4-9 4-9-2-9-4 4-4 9-4 M3 7v10c0 2 4 4 9 4s9-2 9-4V7 M3 12c0 2 4 4 9 4s9-2 9-4',about:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 11v6 M12 7v.1',world:'M12 3 14 9 21 12 14 15 12 21 10 15 3 12 10 9 12 3',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 7v5l4 2',pause:'M9 5v14 M15 5v14',edit:'m15 4 5 5-11 11H4v-5L15 4 M12 7l5 5',bell:'M6 17V9a6 6 0 0 1 12 0v8l2 2H4l2-2 M9 22h6',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7 M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0',send:'m3 3 18 9-18 9 4-9-4-9 M7 12h14',font:'M4 19 10 5l6 14 M6 14h8 M17 9h5 M19 9v10'};
const svg=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.about}"/></svg>`;
const row=(icon,title,value='',action='',detail='',extra='')=>`<button class="row ${extra}" type="button" data-action="${action||'demo'}"><span class="icon">${svg(icon)}</span><span class="copy"><strong>${title}</strong>${detail?`<small>${detail}</small>`:''}</span>${value?`<span class="tail">${value}</span>`:''}${svg('arrow','chevron')}</button>`;
const toggle=(title,detail,on=true)=>`<div class="row"><span class="copy"><strong>${title}</strong><small>${detail}</small></span><button class="switch-hit" role="switch" aria-label="${title}" aria-checked="${on}" data-toggle><span class="switch" aria-checked="${on}" aria-hidden="true"></span></button></div>`;
const group=(title,body,scope='')=>`<section class="group"><h3>${title}${scope?`<span class="scope">${scope}</span>`:''}</h3><div class="box">${body}</div></section>`;
const option=(title,detail,selected=false)=>`<button type="button" class="option" role="radio" aria-checked="${selected}"><span class="copy"><strong>${title}</strong><small>${detail}</small></span><span class="radio" aria-hidden="true"></span></button>`;
const status=`<div class="status"><span>9:41</span><span>•••<i aria-hidden="true"></i></span></div>`;
function frame(el,title,content,back='',footer=''){el.innerHTML=status+`<header class="bar">${back?`<button aria-label="返回" data-action="${back}">${svg('back')}</button>`:'<span class="spacer"></span>'}<strong>${title}</strong><span class="spacer"></span></header><div class="content animate">${content}</div>${footer?`<footer class="footer">${footer}</footer>`:''}<div class="home-indicator"></div>`;}
function home(el){frame(el,'设置',`<h2>按你的习惯来。</h2><p class="lead">声音、阅读、隐私与连接，都在这里。</p><label class="search">${svg('search')}<input aria-label="搜索设置" placeholder="搜索设置，例如语音、备份" type="search"></label><div id="entries">${group('你的偏好',row('person','个人与账号','头像、密码','account')+row('theme','外观与阅读','浅色 · 标准字号','font')+row('voice','聊天与语音','朗读已开启','voice'))}${group('连接与内容',row('connect','AI 连接','示例：已连接','connection')+row('shield','内容与隐私','日记、朋友圈','privacy'))}${group('设备与软件',row('data','数据与设备','备份、同步','data')+row('about','关于与更新','版本信息','about'))}</div>`);}
function chat(el){frame(el,'聊天设置',`<div class="profile"><span class="avatar">知</span><div><strong>知微</strong><small>当前角色的声音与会话信息</small></div></div>${group('当前角色',row('voice','角色声线','标准女声','characterVoice')+row('connect','会话模型','已固定','model','当前会话沿用首次选择的模型'),'仅知微')}${group('聊天体验',row('voice','声音与回复','朗读已开启','voice')+row('font','聊天字号','标准 · 14','font'),'所有聊天')}<p class="note">全局偏好会影响其他角色的聊天。知微的专属声线单独保存。</p>${group('连接信息',row('about','本角色用量','查看明细','usage','对话次数与模型使用情况'))}`);}
function world(el){frame(el,'世界偏好',`<h2>秋日街角</h2><p class="lead">示例世界 · 让长期规则和眼前的故事各有归处。</p>${group('长期世界设定',row('world','世界规则','3 条生效','rules','例如季节、地点和世界的约定'))}<section class="group"><h3>角色加入时<span class="scope">当前这一段</span></h3><div class="selection" role="radiogroup" aria-label="角色加入方式">${option('带上你们的记忆','沿用已有的共同经历与关系',true)}${option('从此刻开始参与','从当前场景开始加入')}${option('失忆设定','以失忆状态参与这一段世界')}</div></section>${group('继续这段故事',row('clock','推进时间','到晚上…','time')+row('edit','保存这一刻','','saveMoment')+row('pause','暂时离开','','pause','保留进行状态，之后可以继续'))}${group('结束与结算',row('world','结束这一段世界','','finish','结算经历与关系变化，之后只可回看','danger'))}`);}
function moments(el){frame(el,'朋友圈设置',`<h2>分享，有自己的节奏。</h2><p class="lead">决定谁能看到，以及哪些事需要提醒你。</p>${group('消息与提醒',toggle('新互动提醒','显示未读互动的小红点',true)+toggle('发布成功提示','发出动态后显示一条提示',true),'当前账号')}${group('好友分享',toggle('允许好友主动分享','查看他们主动分享的生活近况',true)+row('clock','默认分享节奏','自然 · 约一天','frequency')+row('person','单独调整好友','跟随默认','contacts'))}${group('可见范围',row('shield','不让谁看我的动态','未设置','blocked')+row('eye','不看谁的动态','未设置','muted')+row('clock','角色可看的历史','查看范围','history'))}${group('发布偏好',row('send','默认发布范围','全部角色','audience'))}`);}
function voice(el){const back=el.id==='chat'?'chat':'home';frame(el,'声音与回复',`<h2>让对话听起来更自然。</h2><p class="lead">这些偏好影响所有角色聊天。</p>${group('消息播放',toggle('消息朗读','显示播放入口，点击后听到回复',true)+toggle('以语音消息回复','生成语音气泡，点按播放',false),'所有聊天')}${group('语速',row('clock','朗读速度','标准','speed'))}${group('角色声线',row('voice','使用角色自己的声音','','characterVoice','角色声线在对应聊天设置中调整'))}${group('服务与连接',row('connect','声音服务','Edge','engine')+row('voice','语音输入','查看配置','inputVoice'))}<p class="note">不用了解服务商参数，也能调整日常聊天。连接细节放在需要时才打开的页面里。</p>`,back);}
function font(el){const back=el.id==='chat'?'chat':'home';frame(el,'聊天字号',`<h2>读起来刚刚好。</h2><p class="lead">拖动下方滑块，直接预览聊天文字。</p><div class="preview-chat"><span class="badge">字号预览</span><div class="bubble">今天的街角很安静。<br>我们慢慢聊，不用着急。</div><div class="bubble user">这个大小看起来很舒服。</div></div><div class="font-control"><span style="font-size:12px">小</span><input type="range" min="12" max="22" value="14" step="1" aria-label="聊天字号"><span style="font-size:19px">大</span></div><p class="note">当前：<b data-size>14</b> · 影响所有聊天<br>这是设计预览，保存不会修改实际软件。</p>`,back,`<button class="primary" data-action="saveFont">保存字号</button>`);}
const details={account:['个人与账号','头像与名字、修改密码、账号管理'],connection:['AI 连接','连接状态、默认对话模型、服务商密钥'],privacy:['内容与隐私','日记设置、朋友圈设置、长期世界设定'],data:['数据与设备','备份数据、从备份恢复、局域网同步'],about:['关于与更新','版本信息、检查更新、使用说明'],characterVoice:['角色声线','当前角色的音色与方言'],model:['会话模型','本会话模型已固定。默认模型用于新会话或未指定模型的场景。'],usage:['本角色用量','对话次数、输入输出用量及已有费用估算'],rules:['世界规则','保留原有规则、地点、人物事实等分类；显示生效与暂停状态。'],time:['推进时间','过一会儿、到晚上、到第二天早上、三天以后'],finish:['结束这一段世界','确认页明确说明现有结算与只读回看的后果。此原型不会结束任何实际世界。'],contacts:['单独调整好友','逐个设置好友的分享节奏'],blocked:['不让谁看我的动态','被屏蔽的角色不会看到新动态，也不会参与未完成的互动。'],muted:['不看谁的动态','只调整你看到的内容，不改变对方能否看你的动态。'],history:['角色可看的历史','沿用现有历史窗口与授权规则'],audience:['默认发布范围','沿用全部角色、部分可见、不给谁看、仅自己等现有选择'],engine:['声音服务','服务商名称与连接详情，放在二级页中查看'],inputVoice:['语音输入','沿用当前云端识别密钥与已有能力']};
let toastTimer=new Map();function toast(el,text){el.querySelector('.toast')?.remove();clearTimeout(toastTimer.get(el));const node=document.createElement('div');node.className='toast';node.role='status';node.textContent=text;el.append(node);toastTimer.set(el,setTimeout(()=>node.remove(),2200));}
document.querySelectorAll('.phone').forEach(el=>{
  ({general:home,chat,world,moments})[el.id](el);
  el.addEventListener('click',e=>{
    const toggleButton=e.target.closest('[data-toggle]');if(toggleButton){const on=toggleButton.getAttribute('aria-checked')!=='true';toggleButton.setAttribute('aria-checked',on);toggleButton.querySelector('.switch').setAttribute('aria-checked',on);toast(el,`方案演示：${on?'已开启':'已关闭'}`);return;}
    const opt=e.target.closest('.option');if(opt){opt.closest('[role=radiogroup]').querySelectorAll('.option').forEach(item=>item.setAttribute('aria-checked',String(item===opt)));return;}
    const button=e.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
    if(action==='home')home(el);else if(action==='chat')chat(el);else if(action==='world')world(el);else if(action==='moments')moments(el);else if(action==='voice')voice(el);else if(action==='font')font(el);
    else if(action==='saveFont')toast(el,'方案演示：字号已保存');
    else if(action==='saveMoment'||action==='pause')toast(el,'方案演示：正式界面将执行现有世界操作');
    else if(action==='speed'||action==='frequency'){const choices=action==='speed'?[['慢','0.8 倍'],['标准','1.0 倍'],['快','1.2 倍']]:[['安静','约两天分享一次'],['自然','约一天分享一次'],['活跃','约半天分享一次']];frame(el,action==='speed'?'朗读速度':'分享节奏',`<p class="lead">选择适合你的节奏。当前值有明确的选中标记。</p><div class="selection" role="radiogroup" aria-label="${action==='speed'?'朗读速度':'分享节奏'}">${choices.map((x,i)=>option(x[0],x[1],i===1)).join('')}</div>`,action==='speed'?'voice':'moments');}
    else if(details[action]){const [title,description]=details[action];const back=el.id==='general'?'home':el.id;frame(el,title,`<h2>${title}</h2><p class="note">${description}</p><div class="box"><div class="row"><span class="icon">${svg('about')}</span><span class="copy"><strong>详情页结构示意</strong><small>本页用于讨论信息层级。正式实现会连接现有配置和真实状态。</small></span></div></div>`,back);}
    el.querySelector('.content').scrollTop=0;
  });
  el.addEventListener('input',e=>{if(e.target.type==='search'){const term=e.target.value.trim().toLowerCase();el.querySelectorAll('#entries .row').forEach(row=>{const aliases={voice:'声音 语音 朗读',connection:'api key 密钥 模型',font:'字体 字号 主题 外观',data:'备份 恢复 同步'};row.hidden=!!term&&!`${row.textContent} ${aliases[row.dataset.action]||''}`.toLowerCase().includes(term);row.style.display=row.hidden?'none':'';});el.querySelectorAll('#entries .group').forEach(group=>group.hidden=![...group.querySelectorAll('.row')].some(row=>!row.hidden));}if(e.target.type==='range'){const size=e.target.value;el.querySelectorAll('.bubble').forEach(b=>b.style.fontSize=size+'px');el.querySelector('[data-size]').textContent=size;}});
});
document.querySelector('#theme').onclick=()=>{const dark=!document.querySelector('.phone').classList.contains('dark');document.querySelectorAll('.phone').forEach(el=>el.classList.toggle('dark',dark));document.querySelector('#theme').textContent=dark?'切换浅色预览':'切换深色预览';};
</script>
</body></html>
