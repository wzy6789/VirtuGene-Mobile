<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>VirtuGene 5.2.0 角色记忆与私聊召回验收（星域经历·群聊快照·选择性记忆·互动幂等）</title>
<link rel="stylesheet" href="./verify.css"></head>
<body>
<div id="app">running…</div>
<script>
  // 上报必须用**未被打点**的 fetch：套件内部会把 window.fetch 换成"禁止联网"的版本
  var realFetch = window.fetch.bind(window);
  function report(kind, detail) {
    try { realFetch('/result', { method: 'POST', body: kind + '\n' + detail + '\n\n1 FAILED' }); } catch (e) { /* ignore */ }
  }
  window.addEventListener('error', function (e) {
    report('PAGE ERROR: ' + (e.message || ''), String((e.error && e.error.stack) || e.filename || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    report('UNHANDLED REJECTION', String((e.reason && e.reason.stack) || e.reason));
  });
</script>
<script src="./character-memory.bundle.js"></script>
</body>
</html>
