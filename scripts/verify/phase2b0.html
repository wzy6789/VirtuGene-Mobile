<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>VirtuGene 5.0.0 Phase 2b-0 验收</title></head>
<body>
<div id="app">running…</div>
<script>
  function report(kind, detail) {
    try { fetch('/result', { method: 'POST', body: kind + '\n' + detail }); } catch (e) { /* ignore */ }
  }
  window.addEventListener('error', function (e) {
    report('PAGE ERROR: ' + (e.message || ''), String((e.error && e.error.stack) || e.filename || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    report('UNHANDLED REJECTION', String((e.reason && e.reason.stack) || e.reason));
  });
</script>
<script src="./phase2b0.bundle.js"></script>
</body>
</html>
